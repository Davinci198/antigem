name: Build Standard APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  build-standard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build standard debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleStandardDebug

      - name: Collect artifacts
        run: |
          mkdir -p output
          find app/build/outputs/apk/standard/debug -name '*.apk' -exec cp {} output/antiGem-standard-debug.apk \;
          if [ -f app/src/main/assets/bin/agy_ide_bridge ]; then
            cp app/src/main/assets/bin/agy_ide_bridge output/agy_ide_bridge-android-arm64
          fi
          ls -lh output

      - name: Upload APK and bridge
        uses: actions/upload-artifact@v4
        with:
          name: antigem-standard
          path: output/*
          if-no-files-found: error

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
